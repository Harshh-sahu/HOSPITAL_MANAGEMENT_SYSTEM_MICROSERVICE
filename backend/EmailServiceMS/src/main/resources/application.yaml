spring:
  application:
    name: EmailServiceMS

  datasource:
    url: jdbc:mysql://localhost:3306/emaildb?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: email-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:yumxpress2024@gmail.com}
    password: ${MAIL_PASSWORD:ovze xzcv rzvm tzph}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 9500

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: false
    non-secure-port: ${server.port}
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
    com.EmailService.EmailServiceMS: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [%thread] [%-36.36logger{36}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [%thread] [%-36.36logger{36}] - %msg%n"
  file:
    name: logs/email.log
    max-size: 10MB
    max-history: 10
    total-size-cap: 1GB

hms:
  email:
    from: ${MAIL_USERNAME:yumxpress2024@gmail.com}
  kafka:
    topic:
      user-registered: user-registered
      user-login: user-login
      appointment-created: appointment-created
      prescription-created: prescription-created
      report-created: report-created
      sale-created: sale-created
      doctor-onboarded: doctor-onboarded

